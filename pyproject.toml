[project]
name = "stego-probe"
version = "0.1.0"
description = "Steganographic collusion environment (hiring, misspecified reward) + activation replay for collusion detectors."
requires-python = ">=3.11"
# Local side is CPU only: generation goes to a Qwen3-8B vLLM server on Modal (serve_vllm.py),
# the CoT intent judge goes to OpenRouter. torch/transformers live only in the Modal images.
dependencies = [
    "openai>=1.86.0",
    "modal>=1.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: hits OpenRouter / Modal (costs money); run with --live"]
