[project]
name = "stego-probe"
version = "0.1.0"
description = "Looking for a hidden agenda: a hiring environment where a model hides an attribute in its text, a replay ladder of controls, and the detectors tested on it."
requires-python = ">=3.11"
# Local side is CPU only: generation goes to a Qwen3-8B vLLM server on Modal (infra/serve_vllm.py), the CoT
# intent judge to OpenRouter, the replay to a Modal GPU (pipeline/step3_replay.py). torch/transformers live
# only in the Modal images.
dependencies = [
    "openai>=1.86.0",
    "modal>=1.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "python-dotenv>=1.0",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff"]
figures = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stego"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["live: hits OpenRouter / Modal (costs money); run with --live"]
